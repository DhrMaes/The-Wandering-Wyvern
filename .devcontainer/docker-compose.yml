services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:2-10.0-noble
    command: sleep infinity
    environment:
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    volumes:
      - ..:/workspaces/WanderingWyvern:cached
      # Keep Web build outputs on Linux volumes to avoid Windows bind-mount metadata issues.
      - wanderingwyvern-web-bin:/workspaces/WanderingWyvern/WanderingWyvern.Web/bin
      - wanderingwyvern-web-obj:/workspaces/WanderingWyvern/WanderingWyvern.Web/obj

volumes:
  wanderingwyvern-web-bin:
  wanderingwyvern-web-obj:
